[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventnet"
version = "0.1.0"
description = "Multi-zone ventilation catalog and tracer-gas observation chamber (synthetic, educational)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
ventnet = "ventnet.cli:main"

[tool.setuptools.packages.find]
include = ["ventnet*"]
