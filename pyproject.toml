[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratcorr"
version = "0.1.0"
description = "Independent horizon correlation catalogue and borehole analysis repository (synthetic data, no engineering interpretation)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "stratcorr"}]
dependencies = []

[project.scripts]
stratcorr = "stratcorr.cli:main"

[tool.setuptools.packages.find]
include = ["stratcorr*"]
